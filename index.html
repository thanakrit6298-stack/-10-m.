<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>

<title>10M Lathe Scheduling — Thanakrit Engineer Workshop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#030c18;color:#c5d8ea;font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:#071422;}
::-webkit-scrollbar-thumb{background:#172a40;border-radius:3px;}
input,select,textarea,button{font-family:inherit;}

/* ── MODAL OVERLAY ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.87);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-box{background:#071422;border:1px solid #172a40;border-radius:12px;width:100%;max-width:640px;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,0.8);}
.modal-header{padding:20px 26px;border-bottom:1px solid #172a40;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#071422;z-index:1;}
.modal-header h2{color:#c5d8ea;font-size:16px;font-weight:800;}
.modal-header small{color:#324d66;font-size:11px;margin-top:3px;display:block;}
.btn-close{background:none;border:1px solid #172a40;border-radius:6px;color:#6e8fa8;cursor:pointer;padding:6px 12px;font-size:14px;}
.modal-body{padding:24px;}

/* ── FORM ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-field label{color:#6e8fa8;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;display:block;margin-bottom:5px;}
.form-field label .req{color:#f87171;margin-left:3px;}
.form-input{background:#060e1a;border:1px solid #172a40;border-radius:6px;color:#c5d8ea;padding:9px 12px;font-size:13px;outline:none;width:100%;}
.form-input:focus{border-color:#2b7de9;}
.form-input[type=date]{color-scheme:dark;}
.wds-box{display:flex;align-items:center;justify-content:center;background:#0c1d30;border-radius:8px;border:1px solid #0a1624;flex-direction:column;gap:3px;padding:14px 0;}
.wds-box .wds-label{color:#324d66;font-size:10px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.wds-box .wds-num{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;}
.wds-box .wds-unit{color:#324d66;font-size:11px;}

/* ── BUTTONS ── */
.btn-primary{background:linear-gradient(135deg,#1a5cb4,#0896b3);color:#fff;border:none;border-radius:6px;padding:9px 24px;cursor:pointer;font-size:13px;font-weight:700;}
.btn-primary:disabled{background:#101826;color:#324d66;cursor:not-allowed;opacity:.5;}
.btn-secondary{background:#162030;color:#6e8fa8;border:1px solid #172a40;border-radius:6px;padding:9px 20px;cursor:pointer;font-size:13px;font-weight:600;}
.btn-danger{background:linear-gradient(135deg,#c0202a,#8b0000);color:#fff;border:none;border-radius:6px;padding:10px 22px;cursor:pointer;font-size:13px;font-weight:700;}
.btn-warning{background:linear-gradient(135deg,#d97706,#b45309);color:#fff;border:none;border-radius:6px;padding:9px 20px;cursor:pointer;font-size:13px;font-weight:700;}
.btn-icon{background:transparent;border:1px solid #0a1624;border-radius:4px;cursor:pointer;padding:3px 7px;font-size:12px;}
.btn-edit{color:#5ba4f5;}
.btn-del{color:#f87171;}
.btn-add{background:linear-gradient(135deg,#1a5cb4,#0896b3);color:#fff;border:none;border-radius:6px;padding:9px 18px;cursor:pointer;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;box-shadow:0 0 16px rgba(26,92,180,.25);}
.btn-reset{background:transparent;color:#324d66;border:1px solid #172a40;border-radius:6px;padding:9px 14px;cursor:pointer;font-size:12px;}
.btn-print{background:linear-gradient(135deg,#155e3a,#0d7a4a);color:#fff;border:none;border-radius:6px;padding:11px 20px;cursor:pointer;font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px;box-shadow:0 0 16px rgba(13,122,74,.3);letter-spacing:.3px;}
.btn-print:hover{background:linear-gradient(135deg,#1a7a4a,#12a060);transform:translateY(-1px);box-shadow:0 4px 20px rgba(13,122,74,.4);}

/* ── STATS BAR ── */
.stats-bar{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:24px;}
.stat-card{background:#071422;border:1px solid #172a40;border-radius:8px;padding:14px 16px;}
.stat-label{color:#324d66;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px;}
.stat-num{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;}
.stat-unit{font-size:12px;color:#324d66;margin-left:4px;}

/* ── TABS ── */
.tab-bar{display:flex;align-items:center;border-bottom:1px solid #172a40;margin-bottom:20px;padding-bottom:1px;flex-wrap:wrap;gap:4px;}
.tab-btn{background:none;border:none;cursor:pointer;padding:13px 24px;font-size:14px;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;color:#324d66;transition:all .15s;}
.tab-btn.active{color:#5ba4f5;font-weight:800;border-bottom-color:#2b7de9;}
.tab-actions{margin-left:auto;display:flex;gap:8px;align-items:center;padding:6px 0;}

/* ── TABLE ── */
.filter-bar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
.filter-bar input,.filter-bar select{background:#071422;border:1px solid #172a40;border-radius:6px;color:#c5d8ea;padding:8px 12px;font-size:12px;outline:none;}
.filter-bar input:focus,.filter-bar select:focus{border-color:#2b7de9;}
.table-wrap{overflow:auto;border-radius:8px;border:1px solid #172a40;}
table{width:100%;border-collapse:collapse;min-width:1200px;}
thead th{background:#040c17;color:#324d66;font-size:10px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;padding:11px 14px;text-align:left;border-bottom:2px solid #172a40;white-space:nowrap;}
tbody td{padding:9px 14px;border-bottom:1px solid #0a1624;font-size:13px;color:#6e8fa8;vertical-align:middle;}
tbody tr.active-row{background:rgba(43,125,233,.06);}
tbody tr.even-row{background:rgba(8,15,28,.5);}
tbody tr:hover{background:rgba(43,125,233,.04);}
.badge{background:rgba(0,0,0,.2);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700;white-space:nowrap;border-width:1px;border-style:solid;}
.area-badge{background:rgba(99,102,241,.1);color:#a5b4fc;border:1px solid rgba(99,102,241,.22);border-radius:12px;padding:2px 9px;font-size:11px;font-weight:600;}
.status-select{background:#0c1d30;border:1px solid #172a40;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;}

/* ── GANTT ── */
#gantt-container{overflow:auto;border:1px solid #172a40;border-radius:8px;}
.gantt-inner{position:relative;}
.gantt-header{position:sticky;top:0;z-index:20;display:flex;}
.gantt-label-col{width:300px;flex-shrink:0;position:sticky;left:0;z-index:21;background:#050d1a;border-right:1px solid #172a40;}
.gantt-label-top{height:34px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid #0a1624;}
.gantt-label-sub{height:32px;padding:0 16px;display:flex;align-items:center;border-bottom:2px solid #172a40;}
.gantt-months{display:flex;height:34px;background:#050d1a;border-bottom:1px solid #0a1624;}
.gantt-days{display:flex;height:32px;background:#050d1a;border-bottom:2px solid #172a40;}
.gantt-month-cell{flex-shrink:0;background:#050d1a;border-left:2px solid rgba(43,125,233,.14);display:flex;align-items:center;padding:0 8px;color:#6fc7eb;font-size:13px;font-weight:700;overflow:hidden;white-space:nowrap;}
.gantt-day-cell{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-left:1px solid #0a1624;}
.gantt-day-cell.mon{border-left:2px solid #1e3a52;}
.gantt-day-cell.today{background:rgba(239,68,68,.25);}
.gantt-day-cell.off{background:rgba(0,0,0,.55);}
.gantt-day-num{font-size:10px;line-height:1;}
.gantt-day-dw{font-size:8px;line-height:1;}
.gantt-row{display:flex;border-bottom:1px solid #0a1624;}
.gantt-row-label{width:300px;flex-shrink:0;position:sticky;left:0;z-index:10;border-right:1px solid #172a40;padding:0 16px;display:flex;align-items:center;gap:10px;}
.gantt-row-bar-area{flex:1;position:relative;overflow:hidden;}
.today-line{position:absolute;top:0;width:2px;background:rgba(239,68,68,.55);z-index:3;pointer-events:none;}
.today-badge{position:absolute;background:#ef4444;color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:3px;z-index:25;pointer-events:none;letter-spacing:.5px;}

/* ── GANTT LEGEND ── */
.gantt-legend{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#040d1a;border:1px solid #172a40;border-radius:8px;margin-bottom:16px;}
.legend-item{display:flex;align-items:center;gap:7px;font-size:12px;color:#6e8fa8;}
.legend-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}

/* ── SUMMARY ── */
.summary-section{margin-bottom:28px;}
.summary-title{color:#6e8fa8;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:16px;}
.progress-bar{height:6px;background:#0a1525;border-radius:4px;overflow:hidden;margin-top:6px;}
.progress-fill{height:100%;border-radius:4px;transition:width .6s ease;}
.area-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
.area-card{background:#0c1d30;border:1px solid #0a1624;border-radius:8px;padding:12px 16px;}
.cal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cal-card{padding:10px 14px;background:#070f1c;border-radius:6px;border:1px solid #0a1624;}
.cal-card-label{color:#324d66;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:4px;}
.cal-card-val{color:#c5d8ea;font-size:13px;font-weight:600;}

/* ── PANEL ── */
.panel{background:#071422;border:1px solid #172a40;border-radius:10px;padding:24px;}

/* ── ADMIN LOGIN MODAL ── */
.admin-login-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.9);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.admin-login-box{background:rgba(6,12,22,.98);border:1px solid #172a40;border-radius:14px;padding:44px 48px;width:400px;box-shadow:0 0 80px rgba(26,92,180,.15),0 30px 60px rgba(0,0,0,.8);position:relative;}
.admin-login-topbar{position:absolute;top:0;left:48px;right:48px;height:2px;background:linear-gradient(135deg,#1a5cb4,#0896b3);border-radius:0 0 4px 4px;}
.warn-box{margin-top:14px;padding:11px 16px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.18);border-radius:8px;color:#fbbf24;font-size:12px;line-height:1.7;}
.err-box{margin-top:14px;padding:11px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:8px;color:#f87171;font-size:12px;}

/* ── HEADER ── */
#app-header{background:#040a16;border-bottom:1px solid #172a40;padding:0 24px;display:flex;align-items:center;height:64px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(0,0,0,.5);}
.header-logo{width:40px;height:40px;background:linear-gradient(135deg,#1a5cb4,#0896b3);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 15px rgba(26,92,180,.3);}
.role-badge-admin{background:rgba(251,191,36,.1);color:#fbbf24;border:1px solid rgba(251,191,36,.3);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;}
.btn-admin-login{background:rgba(43,125,233,.12);color:#5ba4f5;border:1px solid rgba(43,125,233,.3);border-radius:20px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;}
.btn-admin-login:hover{background:rgba(43,125,233,.22);}

/* ── CREDIT FOOTER ── */
#credit-bar{text-align:center;padding:18px 24px;color:#1e3a52;font-size:12px;letter-spacing:1px;border-top:1px solid #0a1624;margin-top:8px;}
#credit-bar .credit-name{color:#2b7de9;font-weight:800;font-size:13px;}
#credit-bar .credit-sub{color:#162433;font-size:11px;margin-top:4px;}

/* ── PRINT STYLES ── */
@media print {
  body{background:#fff !important;color:#000 !important;}
  #app-header,#stats-bar,.tab-bar,#credit-bar,.gantt-legend,#print-toolbar{display:none !important;}
  .panel{background:#fff !important;border:none !important;padding:0 !important;}
  #tab-gantt{display:block !important;}
  #tab-table,#tab-summary{display:none !important;}
  #gantt-container{overflow:visible !important;border:none !important;}
  .gantt-inner{color:#000;}
  .gantt-label-col,
  .gantt-row-label{background:#f0f4f8 !important;border-color:#ccc !important;}
  .gantt-month-cell{color:#1a3a6b !important;background:#dce8f7 !important;border-color:#aac3e0 !important;}
  .gantt-header{position:relative !important;}
  .gantt-row-label{position:relative !important;}
  thead th{background:#dce8f7 !important;color:#2c4a6e !important;}
  .gantt-day-cell.today{background:rgba(239,68,68,.18) !important;}
  .gantt-day-cell.off{background:#eee !important;}
  #print-header{display:block !important;}
  @page{size:A3 landscape;margin:10mm;}
}
#print-header{display:none;text-align:center;padding-bottom:10px;border-bottom:2px solid #1a3a6b;margin-bottom:14px;}
#print-header h1{font-size:20px;color:#1a3a6b;font-weight:900;}
#print-header .ph-sub{font-size:12px;color:#555;margin-top:4px;}
#print-header .ph-meta{display:flex;justify-content:space-between;margin-top:10px;font-size:11px;color:#666;}
</style>

<script>
// ══════════════════════════════════════════
// CONSTANTS  (รหัสแอดมินไม่โชว์ในซอร์สโค้ด)
// ══════════════════════════════════════════
const _a = atob('d29ya3Nob3AyMDI2');   // ← encoded, ไม่โชว์ plain text
const AREAS = ["Area A","Area B","Area C","Area D","Area E","Workshop","พื้นที่พิเศษ"];
const STS = [
  {v:"pending",     lb:"รอดำเนินการ",    c:"#94a3b8"},

const MTs=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const MTl=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const DT=["อา","จ","อ","พ","พฤ","ศ","ส"];

// ── WORKING DAY ENGINE ──
const OFF=new Set(["2026-05-30","2026-06-06"]);
const RWS=new Date("2026-05-16T00:00:00");
function dk(d){const t=new Date(d);return`${t.getFullYear()}-${("0"+(t.getMonth()+1)).slice(-2)}-${("0"+t.getDate()).slice(-2)}`;}
function isWD(date){const d=new Date(date);d.setHours(0,0,0,0);const w=d.getDay();if(w===0)return false;if(w===6){if(OFF.has(dk(d)))return false;return Math.round((d-RWS)/6048e5)%2===0;}return true;}
function countWDs(s,e){let d=new Date(s);d.setHours(0,0,0,0);const en=new Date(e);en.setHours(0,0,0,0);let c=0;while(d<=en){if(isWD(d))c++;d.setDate(d.getDate()+1);}return c;}

const fmtD=s=>{if(!s)return"—";const d=new Date(s);return`${d.getDate()} ${MTs[d.getMonth()]} ${d.getFullYear()}`;};

// ══════════════════════════════════════════

// ══════════════════════════════════════════
function saveToStorage(){
  try{localStorage.setItem(SK, JSON.stringify(jobs));}catch(e){}
  const st=document.getElementById('sync-time');
  if(st) st.textContent='sync '+new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
function loadFromStorage(){
  try{const v=localStorage.getItem(SK);if(v)jobs=JSON.parse(v);}catch(e){}
}

// ══════════════════════════════════════════
// INIT
// ══════════════════════════════════════════
window.addEventListener('DOMContentLoaded', ()=>{
  loadFromStorage();
  updateHeaderDate();
  renderHeaderActions();
  renderTabActions();
  renderAll();
  // Viewer auto-refresh every 15s
  setInterval(()=>{
    if(role!=='admin'){
      loadFromStorage();
      renderAll();
    }
  },15000);
});

function updateHeaderDate(){
  const now=new Date();
  const el=document.getElementById('header-date');
  if(el) el.textContent=`${now.getDate()} ${MTs[now.getMonth()]} ${now.getFullYear()}`;
}

function renderHeaderActions(){
  const el=document.getElementById('header-actions');
  if(!el)return;
  if(role==='admin'){
    el.innerHTML=`
      <div class="role-badge-admin">👑 ADMIN</div>
      <button onclick="doLogout()" class="btn-secondary" style="padding:7px 14px;font-size:12px;">ออกจากระบบ</button>`;
  } else {
    el.innerHTML=`
      <button class="btn-admin-login" onclick="openAdminLogin()">🔐 Admin Login</button>`;
  }
}

function renderAll(){
  renderStats();
  renderCurrentTab();
}

// ══════════════════════════════════════════
// ADMIN LOGIN MODAL
// ══════════════════════════════════════════
function openAdminLogin(){

  <div class="admin-login-overlay" onclick="if(event.target===this)closeAdminLogin()">
    <div class="admin-login-box">
      <div class="admin-login-topbar"></div>
      <div style="text-align:center;margin-bottom:28px;">
        <div style="width:64px;height:64px;background:linear-gradient(135deg,#1a5cb4,#0896b3);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;box-shadow:0 0 30px rgba(26,92,180,.3);">🔐</div>
        <div style="color:#2b7de9;font-size:10px;letter-spacing:3px;text-transform:uppercase;font-weight:800;margin-bottom:8px;">ADMIN ACCESS</div>
        <h2 style="color:#c5d8ea;font-size:18px;font-weight:900;">เข้าสู่ระบบแอดมิน</h2>
        <p style="color:#324d66;font-size:12px;margin-top:6px;">สำหรับผู้ดูแลระบบเท่านั้น</p>
      </div>
      <div style="height:1px;background:linear-gradient(90deg,transparent,#172a40,transparent);margin:0 0 22px;"></div>
      <div style="margin-bottom:16px;">
        <label style="color:#6e8fa8;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:8px;">🔑 รหัสผ่าน</label>
        <input type="password" id="adm-pw" placeholder="กรอกรหัสผ่าน..." autocomplete="off"
          style="width:100%;padding:12px 16px;background:#060e1a;border:1px solid #172a40;border-radius:8px;color:#c5d8ea;font-size:14px;outline:none;letter-spacing:1.5px;"/>
        <div id="adm-err" style="color:#f87171;font-size:12px;margin-top:7px;display:none;">⚠ รหัสผ่านไม่ถูกต้อง</div>
      </div>
      <button onclick="doAdminLogin()" style="width:100%;padding:13px;background:linear-gradient(135deg,#1a5cb4,#0896b3);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:1.5px;text-transform:uppercase;">เข้าสู่ระบบ</button>
      <button onclick="closeAdminLogin()" style="width:100%;padding:10px;margin-top:10px;background:transparent;border:1px solid #172a40;border-radius:8px;color:#324d66;font-size:12px;cursor:pointer;">ยกเลิก</button>

  setTimeout(()=>document.getElementById('adm-pw')?.focus(),50);

function doAdminLogin(){
  const pw=document.getElementById('adm-pw').value;
  if(pw===_a){
    role='admin';
    closeAdminLogin();
    renderHeaderActions();
    renderTabActions();
    renderAll();
  } else {
    const e=document.getElementById('adm-err');
    if(e){e.style.display='block';document.getElementById('adm-pw').value='';}
  }
}

function closeAdminLogin(){document.getElementById('modal-root').innerHTML='';}

function doLogout(){
  role='viewer';
  renderHeaderActions();
  renderTabActions();
  renderAll();
}

// ══════════════════════════════════════════
// TAB SWITCH
// ══════════════════════════════════════════
function switchTab(t, btn){
  currentTab=t;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['table','gantt','summary'].forEach(id=>{
    document.getElementById('tab-'+id).style.display = id===t?'':'none';
  });
  renderCurrentTab();
}

function renderCurrentTab(){
  if(currentTab==='table') renderTable();
  else if(currentTab==='gantt') renderGantt();
  else if(currentTab==='summary') renderSummary();
}

function renderTabActions(){
  const isAdmin=role==='admin';
  const el=document.getElementById('tab-actions');
  if(!el)return;
  if(isAdmin){
    el.innerHTML=`
      <button class="btn-print" onclick="printGantt()">🖨️ พิมพ์ Gantt Chart</button>
      <button class="btn-add" onclick="openJobModal(null)">➕ เพิ่มงานใหม่</button>
      <button class="btn-reset" onclick="resetData()" title="รีเซ็ตข้อมูล">🔄</button>
    `;
  } else {
    el.innerHTML='';
  }
}

function resetData(){
  if(confirm('รีเซ็ตข้อมูลทั้งหมดกลับสู่ค่าเริ่มต้น?')){
    jobs=JSON.parse(JSON.stringify(INIT));
    saveToStorage();
    renderAll();
  }
}

// ══════════════════════════════════════════
// PRINT GANTT  (admin only)
// ══════════════════════════════════════════
function printGantt(){
  if(role!=='admin') return; // guard — viewers cannot print
  // Switch to gantt tab first
  if(currentTab!=='gantt'){
    switchTab('gantt', document.getElementById('tbtn-gantt'));
  }
  // Update print header meta
  const now=new Date();
  const dateStr=`${now.getDate()} ${MTs[now.getMonth()]} ${now.getFullYear()}`;
  const metaEl=document.getElementById('ph-meta-content');
  if(metaEl){
    metaEl.innerHTML=`
      <span>📍 Thanakrit Engineer Workshop</span>
      <span>📅 พิมพ์เมื่อ: ${dateStr}</span>
      <span>📋 จำนวนงาน: ${jobs.length} รายการ</span>`;
  }
  setTimeout(()=>window.print(), 120);
}

// ══════════════════════════════════════════
// STATS BAR
// ══════════════════════════════════════════
function renderStats(){
  const tot=jobs.length;
  const done=jobs.filter(j=>j.status==='completed').length;
  const act=jobs.filter(j=>j.status==='in-progress').length;
  const pend=jobs.filter(j=>j.status==='pending').length;
  const del=jobs.filter(j=>j.status==='delayed').length;
  const wds=jobs.reduce((a,j)=>a+countWDs(j.start,j.end),0);
  const cards=[
    {i:'📋',lb:'งานทั้งหมด',v:tot,c:'#5ba4f5'},
    {i:'⚙',lb:'กำลังดำเนินการ',v:act,c:'#fbbf24'},
    {i:'✅',lb:'เสร็จสิ้น',v:done,c:'#34d399'},
    {i:'⏳',lb:'รอดำเนินการ',v:pend,c:'#94a3b8'},
    {i:'⚠',lb:'ล่าช้า',v:del,c:'#f87171'},
    {i:'🗓',lb:'วันทำงานรวม',v:wds,c:'#c084fc',u:'วัน'},
  ];
  const el=document.getElementById('stats-bar');
  if(el) el.innerHTML=cards.map(c=>`
    <div class="stat-card" style="border-top:2px solid ${c.c}38;">
      <div class="stat-label">${c.i} ${c.lb}</div>
      <div class="stat-num" style="color:${c.c};">${c.v}${c.u?`<span class="stat-unit">${c.u}</span>`:''}</div>
    </div>
  `).join('');
}

// ══════════════════════════════════════════
// TABLE VIEW
// ══════════════════════════════════════════
let tblQuery='', tblArea='', tblStatus='';
function renderTable(){
  const isAdmin=role==='admin';
  const today=dk(new Date());
  const sorted=[...jobs].sort((a,b)=>a.start.localeCompare(b.start));
  const vis=sorted.filter(j=>{
    if(tblArea&&j.area!==tblArea)return false;
    if(tblStatus&&j.status!==tblStatus)return false;
    if(tblQuery){const l=tblQuery.toLowerCase();return j.partName.toLowerCase().includes(l)||j.jobNo.toLowerCase().includes(l)||(j.mat||'').toLowerCase().includes(l)||(j.area||'').toLowerCase().includes(l);}
    return true;
  });
  const adminCols=isAdmin?'<th>จัดการ</th>':'';
  const rows=vis.map((j,vi)=>{
    const posN=sorted.indexOf(j)+1;
    const isActive=j.start<=today&&j.end>=today;
    const wds=countWDs(j.start,j.end);
    const st=STS.find(s=>s.v===j.status)||STS[0];
    const rowCls=isActive?'active-row':vi%2===0?'even-row':'';
    const statusCell=isAdmin
      ?`<select class="status-select" style="color:${st.c};" onchange="handleStatus('${j.id}',this.value)">${STS.map(s=>`<option value="${s.v}"${s.v===j.status?' selected':''}>${s.lb}</option>`).join('')}</select>`
      :`<span class="badge" style="background:${st.c}22;color:${st.c};border-color:${st.c}40;">${st.lb}</span>`;
    const adminActions=isAdmin?`<td><div style="display:flex;gap:4px;">
      <button class="btn-icon btn-edit" onclick="openJobModal('${j.id}')" title="แก้ไข">✏</button>
      <button class="btn-icon btn-del" onclick="openDeleteModal('${j.id}')" title="ลบ">🗑</button>
    </div></td>`:'';
    return `<tr class="${rowCls}">
      <td style="color:#324d66;text-align:center;font-variant-numeric:tabular-nums;">${posN}${isActive?'<span style="margin-left:4px;color:#f59e0b;font-size:9px;">●</span>':''}</td>
      <td style="font-family:monospace;color:#5ba4f5;font-size:12px;">${j.jobNo||'—'}</td>
      <td style="font-weight:700;color:#c5d8ea;">${j.partName}</td>
      <td style="font-family:monospace;color:#6fc7eb;font-size:12px;">${j.drawNo||'—'}</td>
      <td style="font-family:monospace;font-size:12px;">${j.mat||'—'}</td>
      <td style="font-family:monospace;font-size:12px;">${j.dia||'—'}</td>
      <td style="font-family:monospace;font-size:12px;">${j.len?j.len+' mm':'—'}</td>
      <td style="text-align:center;">${j.qty}</td>
      <td><span class="area-badge">${j.area}</span></td>
      <td style="white-space:nowrap;font-variant-numeric:tabular-nums;">${fmtD(j.start)}</td>
      <td style="white-space:nowrap;font-variant-numeric:tabular-nums;">${fmtD(j.end)}</td>
      <td style="text-align:center;color:#2b7de9;font-weight:800;font-variant-numeric:tabular-nums;">${wds}</td>
      <td>${statusCell}</td>
      <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:#324d66;">${j.notes||'—'}</td>
      ${adminActions}
    </tr>`;
  }).join('');

  document.getElementById('tab-table').innerHTML=`
    <div class="filter-bar">
      <input id="tbl-search" type="text" placeholder="🔍 ค้นหาชื่อชิ้นงาน / เลขงาน / พื้นที่..." value="${tblQuery}" oninput="tblQuery=this.value;renderTable();" style="min-width:280px;"/>
      <select id="tbl-area" onchange="tblArea=this.value;renderTable();">
        <option value="">📍 ทุกพื้นที่</option>${AREAS.map(a=>`<option value="${a}"${a===tblArea?' selected':''}>${a}</option>`).join('')}
      </select>
      <select id="tbl-status" onchange="tblStatus=this.value;renderTable();">
        <option value="">📊 ทุกสถานะ</option>${STS.map(s=>`<option value="${s.v}"${s.v===tblStatus?' selected':''}>${s.lb}</option>`).join('')}
      </select>
      <div style="color:#324d66;font-size:12px;margin-left:auto;">${vis.length}/${sorted.length} รายการ</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>#</th><th>เลขที่งาน</th><th>ชื่อชิ้นงาน</th><th>เลขที่แบบ</th>
          <th>วัสดุ</th><th>∅ (mm)</th><th>ยาว (mm)</th><th>จำนวน</th>
          <th>พื้นที่</th><th>วันเริ่มต้น</th><th>วันสิ้นสุด</th><th>วันทำงาน</th>
          <th>สถานะ</th><th>หมายเหตุ</th>${adminCols}
        </tr></thead>
        <tbody>${rows||'<tr><td colspan="20" style="padding:48px;text-align:center;color:#162433;"><div style="font-size:40px;margin-bottom:10px;">🔍</div>ไม่พบข้อมูลที่ตรงกับเงื่อนไข</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

function handleStatus(id, status){
  jobs=jobs.map(j=>j.id===id?{...j,status}:j);
  saveToStorage();
  renderStats();
}

// ══════════════════════════════════════════
// GANTT VIEW
// ══════════════════════════════════════════
const CW=36, RH=54, LW=300;
function renderGantt(){
  const sorted=[...jobs].sort((a,b)=>a.start.localeCompare(b.start));
  if(!sorted.length){
    document.getElementById('tab-gantt').innerHTML='<div style="text-align:center;color:#324d66;padding:60px;"><div style="font-size:48px;margin-bottom:12px;">📅</div>ยังไม่มีข้อมูลงาน</div>';
    return;
  }
  const today=dk(new Date());
  const ms=sorted.reduce((m,j)=>j.start<m?j.start:m,sorted[0].start);
  const me=sorted.reduce((m,j)=>j.end>m?j.end:m,sorted[0].end);
  const startD=addDays(ms,-3),endD=addDays(me,14);
  const days=[];let c=new Date(startD);const en=new Date(endD);
  while(c<=en){days.push(dk(c));c.setDate(c.getDate()+1);}
  const idxMap={};days.forEach((s,i)=>{idxMap[s]=i;});
  const months=[];
  days.forEach(ds=>{
    const dt=new Date(ds),k=`${dt.getFullYear()}-${dt.getMonth()}`;
    const l=months[months.length-1];
    if(!l||l.k!==k)months.push({k,lb:`${MTl[dt.getMonth()]} ${dt.getFullYear()}`,cnt:1});
    else l.cnt++;
  });
  const tdi=idxMap[today]??-1;
  const totalW=LW+days.length*CW;

  const monthsHtml=months.map(m=>`<div class="gantt-month-cell" style="width:${m.cnt*CW}px;">${m.lb}</div>`).join('');
  const daysHtml=days.map((ds,i)=>{
    const d=new Date(ds),off=!isWD(d),itd=ds===today,isMon=d.getDay()===1;
    let cls='gantt-day-cell';if(isMon)cls+=' mon';if(itd)cls+=' today';else if(off)cls+=' off';
    const numC=itd?'#ef4444':off?'#1a2d3d':isMon?'#4a7090':'#2e4a5f';
    const dwC=itd?'#ef4444':off?'#0f1e2c':'#1c3040';
    const fw=itd?900:isMon?700:400;
    return `<div class="${cls}" style="width:${CW}px;"><div class="gantt-day-num" style="color:${numC};font-weight:${fw};">${d.getDate()}</div><div class="gantt-day-dw" style="color:${dwC};">${DT[d.getDay()]}</div></div>`;
  }).join('');

  const rowsHtml=sorted.map((j,ri)=>{
    const st=STS.find(s=>s.v===j.status);
    const si=idxMap[j.start],ei=idxMap[j.end];
    const isActive=j.start<=today&&j.end>=today;
    const wds=countWDs(j.start,j.end);
    const rowBg=isActive?'rgba(43,125,233,.05)':ri%2===0?'rgba(5,10,20,.7)':'transparent';
    const lblBg=isActive?'#05111e':ri%2===0?'#040d1a':'#07101e';
    let barHtml='';
    if(si!==undefined){
      const bl=si*CW+2,bw=((ei===undefined?days.length-1:ei)-si+1)*CW-4;
      const sc=st?.c||'#94a3b8';
      barHtml=`<div style="position:absolute;left:${bl}px;width:${bw}px;top:8px;height:${RH-16}px;background:linear-gradient(90deg,${sc}28,${sc}3a);border:1.5px solid ${sc}60;border-radius:7px;display:flex;align-items:center;padding-left:10px;overflow:hidden;z-index:2;">
        ${bw>80?`<span style="color:${sc};font-size:12px;font-weight:800;white-space:nowrap;">${j.partName}</span>`:''}
        ${bw>260?`<span style="color:${sc}80;font-size:10px;margin-left:10px;white-space:nowrap;">${fmtD(j.start)} – ${fmtD(j.end)}</span>`:''}
      </div>`;
    }
    const todayLineHtml=tdi!==-1?`<div class="today-line" style="left:${tdi*CW+CW/2}px;height:${RH}px;"></div>`:'';
    const bgCells=days.map((ds,i)=>{
      const d=new Date(ds),off=!isWD(d),isMon=d.getDay()===1,itd=ds===today;
      const bg=itd?'rgba(239,68,68,.05)':off?'rgba(0,0,0,.25)':'transparent';
      return `<div style="position:absolute;left:${i*CW}px;top:0;width:${CW}px;height:${RH}px;background:${bg};${isMon?'border-left:1px solid #0a1624':''}"></div>`;
    }).join('');
    return `<div class="gantt-row" style="height:${RH}px;background:${rowBg};">
      <div class="gantt-row-label" style="background:${lblBg};">
        <div style="width:4px;height:34px;background:${st?.c||'#324d66'};border-radius:2px;flex-shrink:0;"></div>
        <div style="overflow:hidden;flex:1;">
          <div style="color:#c5d8ea;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${j.partName}</div>
          <div style="color:#324d66;font-size:10px;white-space:nowrap;display:flex;gap:8px;margin-top:2px;">
            <span style="color:#3a5a7a;">${j.jobNo||'—'}</span>
            <span style="color:#4a5b8a;">${j.area}</span>
            <span style="color:#2a4060;">${wds} วันทำงาน</span>
          </div>
        </div>
      </div>
      <div class="gantt-row-bar-area">${bgCells}${barHtml}${todayLineHtml}</div>
    </div>`;
  }).join('');

  const globalToday=tdi!==-1?`
    <div style="position:absolute;left:${LW+tdi*CW+CW/2}px;top:0;bottom:0;width:2px;background:rgba(239,68,68,.1);z-index:0;pointer-events:none;"></div>
    <div class="today-badge" style="left:${LW+tdi*CW+CW/2-22}px;top:72px;">TODAY</div>`:'';

  // Legend
  const legendHtml=`
    <div class="gantt-legend" id="gantt-legend">
      <span style="color:#6e8fa8;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-right:4px;">คำอธิบาย:</span>
      ${STS.map(s=>`<div class="legend-item"><div class="legend-dot" style="background:${s.c};"></div>${s.lb}</div>`).join('')}
      <div class="legend-item"><div class="legend-dot" style="background:rgba(239,68,68,.25);border:1px solid rgba(239,68,68,.4);"></div>วันนี้</div>
      <div class="legend-item"><div class="legend-dot" style="background:rgba(0,0,0,.55);border:1px solid #172a40;"></div>วันหยุด / ไม่ทำงาน</div>
    </div>`;

  // Print notice banner (admin only)
  const printNoticeBanner = role==='admin' ? `
    <div style="display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(21,94,58,.12);border:1px solid rgba(13,122,74,.28);border-radius:8px;margin-bottom:16px;">
      <span style="font-size:22px;">🖨️</span>
      <div>
        <div style="color:#34d399;font-size:13px;font-weight:800;margin-bottom:2px;">พิมพ์ Gantt Chart — Hard Copy</div>
        <div style="color:#6e8fa8;font-size:11px;">กดปุ่ม <strong style="color:#34d399;">🖨️ พิมพ์ Gantt Chart</strong> ด้านบนขวา เพื่อพิมพ์ A3 แนวนอน ติดที่เครื่องกลึง</div>
      </div>
    </div>` : '';

  document.getElementById('tab-gantt').innerHTML=printNoticeBanner+legendHtml+`
    <div id="gantt-container">
      <div class="gantt-inner" style="min-width:${totalW}px;position:relative;">
        <div class="gantt-header">
          <div class="gantt-label-col">
            <div class="gantt-label-top"><span style="color:#1e3a5a;font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;">10M LATHE — GANTT CHART</span></div>
            <div class="gantt-label-sub"><span style="color:#152030;font-size:10px;">ชิ้นงาน / เลขงาน / พื้นที่</span></div>
          </div>
          <div style="flex:1;">
            <div class="gantt-months">${monthsHtml}</div>
            <div class="gantt-days">${daysHtml}</div>
          </div>
        </div>
        ${rowsHtml}
        ${globalToday}
      </div>
    </div>`;

  if(tdi>0){
    setTimeout(()=>{
      const gc=document.getElementById('gantt-container');
      if(gc) gc.scrollLeft=Math.max(0,tdi*CW-280);
    },60);
  }
}

// ══════════════════════════════════════════
// SUMMARY VIEW
// ══════════════════════════════════════════
function renderSummary(){
  const sorted=[...jobs].sort((a,b)=>a.start.localeCompare(b.start));
  const tot=sorted.length;
  const bySt={};STS.forEach(s=>{bySt[s.v]=0;});
  const byArea={};let wds=0;
  sorted.forEach(j=>{bySt[j.status]=(bySt[j.status]||0)+1;byArea[j.area]=(byArea[j.area]||0)+1;wds+=countWDs(j.start,j.end);});
  const first=sorted[0],last=sorted[sorted.length-1];
  const statusBars=STS.map(st=>{
    const cnt=bySt[st.v]||0,pct=tot?(cnt/tot*100):0;
    return `<div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
        <div style="display:flex;align-items:center;gap:8px;"><div style="width:10px;height:10px;border-radius:50%;background:${st.c};"></div><span style="color:${st.c};font-size:13px;font-weight:600;">${st.lb}</span></div>
        <span style="color:#324d66;font-size:13px;font-family:monospace;">${cnt} งาน (${pct.toFixed(0)}%)</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${st.c};"></div></div>
    </div>`;
  }).join('');
  const areaCards=Object.entries(byArea).sort((a,b)=>b[1]-a[1]).map(([area,cnt])=>`
    <div class="area-card"><div style="color:#a5b4fc;font-size:11px;font-weight:700;margin-bottom:4px;">${area}</div>
    <div style="color:#c5d8ea;font-size:28px;font-weight:900;font-variant-numeric:tabular-nums;">${cnt}</div>
    <div style="color:#324d66;font-size:11px;">งาน</div></div>`).join('');
  const calData=[
    {lb:'วันเริ่มต้นแผนงาน',v:first?fmtD(first.start):'—'},
    {lb:'วันสิ้นสุดงานล่าสุด',v:last?fmtD(last.end):'—'},
    {lb:'รวมวันทำงานทั้งหมด',v:`${wds} วัน`},
    {lb:'จำนวนงานทั้งหมด',v:`${tot} งาน`},
    {lb:'เสาร์ที่ทำงาน',v:'เว้นเสาร์ (สัปดาห์คู่)'},
    {lb:'วันหยุดพิเศษ 2569',v:'30 พ.ค. / 6 มิ.ย.'},
  ];
  document.getElementById('tab-summary').innerHTML=`
    <div class="summary-section"><div class="summary-title">📊 สัดส่วนสถานะงาน</div>${statusBars}</div>
    <div class="summary-section"><div class="summary-title">📍 งานตามพื้นที่</div><div class="area-grid">${areaCards}</div></div>
    <div style="background:#0c1d30;border:1px solid #0a1624;border-radius:8px;padding:20px;">
      <div class="summary-title" style="margin-bottom:14px;">📅 ข้อมูลปฏิทินการทำงาน</div>
      <div class="cal-grid">${calData.map(({lb,v})=>`<div class="cal-card"><div class="cal-card-label">${lb}</div><div class="cal-card-val">${v}</div></div>`).join('')}</div>
    </div>`;
}

// ══════════════════════════════════════════
// JOB MODAL (Admin only)
// ══════════════════════════════════════════
function openJobModal(jobId){
  const job=jobId?jobs.find(j=>j.id===jobId):null;
  const isNew=!job;
  const defaultStart=isNew?getDefaultNewStart():job.start;
  const defaultEnd=isNew?addDays(defaultStart,6):job.end;
  const f=isNew?{id:'',jobNo:'',partName:'',drawNo:'',mat:'',dia:'',len:'',qty:1,area:AREAS[0],start:defaultStart,end:defaultEnd,status:'pending',notes:''}:{...job};
  const areaOpts=AREAS.map(a=>`<option value="${a}"${a===f.area?' selected':''}>${a}</option>`).join('');
  const stOpts=STS.map(s=>`<option value="${s.v}"${s.v===f.status?' selected':''}>${s.lb}</option>`).join('');
  const wds=f.start&&f.end&&f.end>=f.start?countWDs(f.start,f.end):0;
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-overlay" id="job-modal" onclick="if(event.target===this)closeJobModal()">
    <div class="modal-box">
      <div class="modal-header">
        <div><h2>${isNew?'➕ เพิ่มงานใหม่':'✏️ แก้ไข: '+esc(job.partName)}</h2><small>10M CNC Lathe — Job Entry Form</small></div>
        <button class="btn-close" onclick="closeJobModal()">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          ${field('jobNo','เลขที่งาน (Job No.)','text',f.jobNo,'LT-2026-XXX')}
          ${field('partName','ชื่อชิ้นงาน (Part Name)','text',f.partName,'Main Drive Shaft',true)}
          ${field('drawNo','เลขที่แบบ (Drawing No.)','text',f.drawNo,'DWG-XXXX')}
          ${field('mat','วัสดุ (Material)','text',f.mat,'S45C, SS304, AISI 4140...')}
          ${field('dia','เส้นผ่านศูนย์กลาง ∅ (mm)','text',f.dia,'∅450')}
          ${field('len','ความยาว (Length mm)','text',f.len,'2,800')}
          ${field('qty','จำนวน (Qty)','number',f.qty,'1')}
          <div class="form-field"><label>พื้นที่ (Area)</label><select class="form-input" id="jf-area">${areaOpts}</select></div>
          ${field('start','วันที่เริ่ม (Start Date)','date',f.start,'',true)}
          ${field('end','วันที่สิ้นสุด (End Date)','date',f.end,'',true)}
          <div class="form-field"><label>สถานะ (Status)</label><select class="form-input" id="jf-status">${stOpts}</select></div>
          <div class="wds-box">
            <span class="wds-label">วันทำงาน</span>
            <span id="jf-wds" class="wds-num" style="color:${wds>0?'#2b7de9':'#f87171'};">${wds}</span>
            <span class="wds-unit">วัน</span>
          </div>
        </div>
        <div class="form-field" style="margin-top:14px;">
          <label>หมายเหตุ (Notes)</label>
          <textarea class="form-input" id="jf-notes" rows="3" placeholder="Tolerance, surface finish, ข้อควรระวัง...">${esc(f.notes||'')}</textarea>
        </div>
        ${!isNew?'<div class="warn-box">⚠️ หากเลื่อนวันที่เริ่มงาน ระบบจะถามว่าต้องการขยับงานที่ตามมาทั้งหมดโดยอัตโนมัติ</div>':''}
        <div id="jf-err" style="display:none;" class="err-box"></div>
        <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:22px;">
          <button class="btn-secondary" onclick="closeJobModal()">ยกเลิก</button>
          <button class="btn-primary" onclick="saveJob('${f.id||''}','${isNew}','${job?job.start:''}')">
            ${isNew?'➕ เพิ่มงาน':'💾 บันทึกการแก้ไข'}
          </button>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById('jf-start').addEventListener('input',updateWDS);
  document.getElementById('jf-end').addEventListener('input',updateWDS);
}

function field(id,lb,tp,val,ph,req){
  return `<div class="form-field"><label>${lb}${req?'<span class="req">*</span>':''}</label>
    <input class="form-input" type="${tp}" id="jf-${id}" value="${tp==='number'?val:esc(val||'')}" placeholder="${ph||''}"/></div>`;
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function updateWDS(){
  const s=document.getElementById('jf-start')?.value,e=document.getElementById('jf-end')?.value,wEl=document.getElementById('jf-wds');
  if(!wEl)return;
  if(s&&e&&e>=s){const w=countWDs(s,e);wEl.textContent=w;wEl.style.color=w>0?'#2b7de9':'#f87171';}
  else{wEl.textContent='0';wEl.style.color='#f87171';}
}
function closeJobModal(){document.getElementById('modal-root').innerHTML='';}

function saveJob(existingId,isNewStr,origStart){
  const isNew=isNewStr==='true';
  const partName=document.getElementById('jf-partName').value.trim();
  const start=document.getElementById('jf-start').value;
  const end=document.getElementById('jf-end').value;
  const errEl=document.getElementById('jf-err');
  if(!partName){errEl.textContent='⚠ กรุณากรอกชื่อชิ้นงาน';errEl.style.display='block';return;}
  if(!start||!end){errEl.textContent='⚠ กรุณาเลือกวันที่';errEl.style.display='block';return;}
  if(end<start){errEl.textContent='⚠ วันสิ้นสุดต้องไม่ก่อนวันเริ่มต้น';errEl.style.display='block';return;}
  errEl.style.display='none';
  const newJob={
    id:existingId||gid(),
    jobNo:document.getElementById('jf-jobNo').value.trim(),
    partName,drawNo:document.getElementById('jf-drawNo').value.trim(),
    mat:document.getElementById('jf-mat').value.trim(),
    dia:document.getElementById('jf-dia').value.trim(),
    len:document.getElementById('jf-len').value.trim(),
    qty:Math.max(1,parseInt(document.getElementById('jf-qty').value)||1),
    area:document.getElementById('jf-area').value,
    start,end,status:document.getElementById('jf-status').value,
    notes:document.getElementById('jf-notes').value.trim(),
  };
  if(!isNew&&origStart&&origStart!==start){
    const delta=diffDays(origStart,start);
    if(delta!==0){
      const affected=jobs.filter(j=>j.id!==newJob.id&&j.start>=origStart);
      if(affected.length>0){closeJobModal();openCascadeModal(newJob,delta,affected);return;}
    }
  }
  applyJobSave(newJob,null);closeJobModal();
}

// ══════════════════════════════════════════
// CASCADE MODAL
// ══════════════════════════════════════════
function openCascadeModal(updatedJob,delta,affected){
  const rows=affected.map((j,i)=>`
    <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:${i<affected.length-1?'1px solid #0a1624':'none'};background:${i%2===0?'rgba(8,15,28,.5)':'transparent'};">
      <div><div style="color:#c5d8ea;font-size:13px;font-weight:600;">${esc(j.partName)}</div>
      <div style="color:#324d66;font-size:11px;">${fmtD(j.start)} → ${fmtD(j.end)}</div></div>
      <div style="text-align:right;flex-shrink:0;margin-left:12px;">
        <div style="color:#fbbf24;font-size:11px;font-weight:700;">${delta>0?'+'+delta:delta} วัน</div>
        <div style="color:#6e8fa8;font-size:11px;">${fmtD(addDays(j.start,delta))}</div>
      </div>
    </div>`).join('');
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-overlay">
    <div class="modal-box" style="max-width:520px;">
      <div class="modal-header"><div><h2 style="color:#fbbf24;">⚠️ ยืนยันการเลื่อนเวลา</h2><small>Cascade Shift Confirmation</small></div>
        <button class="btn-close" onclick="closeCascadeModal()">✕</button></div>
      <div class="modal-body">
        <div style="padding:13px 16px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:8px;margin-bottom:18px;">
          <div style="color:#c5d8ea;font-size:13px;">งาน <strong style="color:#fbbf24;">${esc(updatedJob.partName)}</strong> ถูกเลื่อน <span style="color:#fbbf24;font-weight:800;font-size:15px;">${delta>0?'+'+delta:delta} วัน</span></div>
        </div>
        <div style="color:#6e8fa8;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;">งานที่จะถูกขยับตาม (${affected.length} รายการ):</div>
        <div style="border:1px solid #172a40;border-radius:8px;overflow:hidden;max-height:200px;overflow-y:auto;">${rows}</div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:20px;">
          <button class="btn-secondary" style="font-size:12px;" onclick="cascadeSkip()">แก้เฉพาะงานนี้</button>
          <button class="btn-warning" onclick="cascadeConfirm()">⚡ ขยับทุกงานที่ตามมา</button>
        </div>
      </div>
    </div>
  </div>`;
  pendingSave={job:updatedJob,delta,affected};
}
function closeCascadeModal(){document.getElementById('modal-root').innerHTML='';pendingSave=null;}
function cascadeConfirm(){if(pendingSave){applyJobSave(pendingSave.job,pendingSave);document.getElementById('modal-root').innerHTML='';pendingSave=null;}}
function cascadeSkip(){if(pendingSave){applyJobSave(pendingSave.job,null);document.getElementById('modal-root').innerHTML='';pendingSave=null;}}
function applyJobSave(job,cascadeData){
  const exists=jobs.some(j=>j.id===job.id);
  if(exists)jobs=jobs.map(j=>j.id===job.id?job:j);else jobs=[...jobs,job];
  if(cascadeData) jobs=jobs.map(j=>cascadeData.affected.some(a=>a.id===j.id)?{...j,start:addDays(j.start,cascadeData.delta),end:addDays(j.end,cascadeData.delta)}:j);
  jobs.sort((a,b)=>a.start.localeCompare(b.start));
  saveToStorage();renderAll();
}

// ══════════════════════════════════════════
// DELETE MODAL
// ══════════════════════════════════════════
function openDeleteModal(jobId){
  const job=jobs.find(j=>j.id===jobId);if(!job)return;
  document.getElementById('modal-root').innerHTML=`
  <div class="modal-overlay" onclick="if(event.target===this)closeDeleteModal()">
    <div style="background:#071422;border:1px solid #172a40;border-radius:12px;padding:36px;width:380px;text-align:center;box-shadow:0 25px 60px rgba(0,0,0,.8);">
      <div style="font-size:44px;margin-bottom:16px;">🗑️</div>
      <h3 style="color:#c5d8ea;margin-bottom:10px;font-size:18px;font-weight:800;">ยืนยันการลบงาน</h3>
      <p style="color:#6e8fa8;font-size:14px;margin-bottom:6px;line-height:1.6;">ต้องการลบงาน <strong style="color:#f87171;">${esc(job.partName)}</strong> ใช่หรือไม่?</p>
      <p style="color:#324d66;font-size:12px;margin-bottom:24px;">การดำเนินการนี้ไม่สามารถยกเลิกได้</p>
      <div style="display:flex;gap:12px;justify-content:center;">
        <button class="btn-secondary" onclick="closeDeleteModal()">ยกเลิก</button>
        <button class="btn-danger" onclick="confirmDelete('${jobId}')">ลบงาน</button>
      </div>
    </div>
  </div>`;
}
function closeDeleteModal(){document.getElementById('modal-root').innerHTML='';}
function confirmDelete(jobId){jobs=jobs.filter(j=>j.id!==jobId);saveToStorage();renderAll();closeDeleteModal();}

// ── HELPERS ──
function getDefaultNewStart(){
  if(!jobs.length)return dk(new Date());
  const lastEnd=jobs.reduce((m,j)=>j.end>m?j.end:m,jobs[0].end);
  return addDays(lastEnd,1);
}
</script>
